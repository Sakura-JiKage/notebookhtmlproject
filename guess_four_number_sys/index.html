<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜数字·双模式 —— 人人PK自动掩码·零输入</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(165deg, #0a1b21 0%, #103138 100%);
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        /* 全局赢家横幅 */
        .global-winner-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(145deg, #ffd166, #ffb347);
            color: #001f24;
            font-size: 28px;
            font-weight: 900;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 40px;
            z-index: 200;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border-bottom: 4px solid #fff9c4;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(255,255,200,0.5);
            animation: slideDown 0.5s ease;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .global-winner-banner.ai-win,
        .global-winner-banner.player2-win {
            background: linear-gradient(145deg, #4f9aa8, #2c6f7a);
            color: white;
            border-bottom: 4px solid #b7f0ff;
        }
        
        .global-winner-banner.human-win,
        .global-winner-banner.player1-win {
            background: linear-gradient(145deg, #ffd166, #ffb347);
            color: #001f24;
        }
        
        .winner-message {
            flex: 1;
            text-align: center;
        }
        
        .banner-restart-btn {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50px;
            padding: 12px 32px;
            font-size: 24px;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2), 0 6px 16px black;
            transition: 0.04s;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .banner-restart-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.2), 0 6px 16px black;
        }
        
        @keyframes slideDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }
        
        /* 开始界面 */
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(165deg, #0a1b21 0%, #103138 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .start-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }
        
        .start-btn {
            background: #ffc857;
            border: none;
            border-radius: 80px;
            padding: 24px 72px;
            font-size: 42px;
            font-weight: 800;
            color: #06222a;
            box-shadow: 0 16px 0 #9e6b2b, 0 20px 40px black;
            cursor: pointer;
            border: 2px solid #ffdd9a;
            transition: 0.06s;
            letter-spacing: 8px;
        }
        .start-btn:active {
            transform: translateY(16px);
            box-shadow: 0 6px 0 #8a5e26, 0 20px 40px black;
        }
        
        /* 设密界面 */
        .setup-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(165deg, #0a1b21 0%, #103138 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 90;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .setup-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }
        
        .setup-box {
            background: rgba(20, 50, 60, 0.9);
            backdrop-filter: blur(12px);
            padding: 48px 60px;
            border-radius: 80px;
            border: 2px solid #4bbaca;
            box-shadow: 0 20px 30px black;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 36px;
            max-width: 900px;
        }
        
        .setup-title {
            font-size: 36px;
            font-weight: 700;
            color: #ffeaa5;
            text-shadow: 0 0 10px #ffd966;
        }
        
        .mode-selector {
            display: flex;
            gap: 30px;
            justify-content: center;
            width: 100%;
            margin: 10px 0;
        }
        
        .mode-btn {
            background: rgba(30, 70, 80, 0.7);
            border: 3px solid #3899ad;
            border-radius: 60px;
            padding: 18px 40px;
            font-size: 28px;
            font-weight: 700;
            color: #c3f0f5;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: 0.1s;
            flex: 1;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        
        .mode-btn.active {
            background: #ffc857;
            border-color: #ffcf6e;
            color: #06222a;
            box-shadow: 0 0 25px #ffd966;
        }
        
        /* 人机PK模式的输入行 */
        .pve-input-row {
            display: flex;
            gap: 20px;
            align-items: center;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        /* 人人PK模式时整个输入区域隐藏 */
        .pve-input-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 36px;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        .pve-input-container.hidden {
            display: none;
        }
        
        .secret-setup-input {
            background: #1f444f;
            border: 4px solid #3899ad;
            border-radius: 60px;
            padding: 20px 36px;
            font-size: 56px;
            font-family: 'Courier New', monospace;
            font-weight: 800;
            letter-spacing: 20px;
            color: #ffe684;
            text-align: center;
            outline: none;
            width: 400px;
            max-width: 80vw;
        }
        .secret-setup-input:focus {
            border-color: #ffc164;
            box-shadow: 0 0 30px #ffe184;
        }
        
        .random-btn {
            background: #4f9aa8;
            border: none;
            border-radius: 60px;
            padding: 20px 32px;
            font-size: 28px;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 0 #2e5e67, 0 6px 16px black;
            transition: 0.04s;
            cursor: pointer;
            border: 1px solid #b7f0ff;
            white-space: nowrap;
        }
        .random-btn:active {
            transform: translateY(8px);
            box-shadow: 0 2px 0 #2e5e67, 0 10px 20px black;
        }
        
        .button-group {
            display: flex;
            gap: 30px;
            justify-content: center;
            width: 100%;
            margin-top: 10px;
        }
        
        .submit-btn {
            background: #ffc857;
            border: none;
            border-radius: 60px;
            padding: 20px 70px;
            font-size: 32px;
            font-weight: 800;
            color: #06222a;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 0 #9e6b2b, 0 6px 16px black;
            transition: 0.04s;
            cursor: pointer;
            border: 2px solid #ffdd9a;
        }
        .submit-btn:active {
            transform: translateY(10px);
            box-shadow: 0 2px 0 #8a5e26, 0 10px 20px black;
        }
        
        /* 主PK界面 */
        .pk-container {
            max-width: 1400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 30px;
            justify-content: center;
            margin-bottom: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease, visibility 0.6s ease;
            margin-top: 100px;
        }
        .pk-container.visible {
            opacity: 1;
            visibility: visible;
        }
        
        .top-secret {
            display: flex;
            justify-content: flex-start;
            width: 100%;
        }
        
        .secret-panel {
            width: 100%;
            max-width: 600px;
            background: rgba(20, 50, 60, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 20px 28px;
            border: 1px solid #4bbaca;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .secret-label {
            font-size: 22px;
            color: #c3f0f5;
        }
        
        .secret-value {
            font-family: 'Courier New', monospace;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 10px;
            background: #143b45;
            padding: 8px 28px;
            border-radius: 50px;
            color: #ffe484;
        }
        
        .guess-row {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            align-items: stretch;
        }
        
        .player1-column {
            flex: 3;
            min-width: 500px;
            background: linear-gradient(145deg, #1e4a57, #15404b);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 28px 28px;
            border: 3px solid #ffcf6e;
            box-shadow: 0 0 30px rgba(255, 200, 100, 0.3), 0 10px 30px black;
        }
        
        .player2-column {
            flex: 1.2;
            min-width: 280px;
            background: rgba(12, 30, 36, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 22px 18px;
            border: 1px solid #2c6a76;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6), 0 5px 15px black;
            opacity: 0.85;
            display: flex;
            flex-direction: column;
        }
        
        .player2-column.pvp-mode {
            background: rgba(25, 55, 65, 0.7);
            border: 2px solid #5fb3c2;
            opacity: 0.95;
        }
        
        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 5px;
        }
        
        .player1-column .column-title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(145deg, #ffeeb5, #ffe070);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px #ffb86b;
        }
        
        .player2-column .column-title {
            font-size: 22px;
            font-weight: 600;
            color: #8faeb7;
            text-shadow: none;
            -webkit-text-fill-color: #8faeb7;
            background: none;
        }
        
        .player2-column.pvp-mode .column-title {
            color: #c3f0f5;
            -webkit-text-fill-color: #c3f0f5;
        }
        
        .round-badge {
            background: #1e4e5a;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 600;
            color: #ffefb2;
            border: 1px solid #6fcbdd;
        }
        
        .player2-column .round-badge {
            background: #183a42;
            color: #b4c9cc;
            border: 1px solid #3e7983;
            font-size: 18px;
            padding: 6px 16px;
        }
        
        .player2-column.pvp-mode .round-badge {
            background: #1e4e5a;
            color: #ffefb2;
            border: 1px solid #6fcbdd;
        }
        
        .input-group {
            display: flex;
            gap: 16px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .digit-input {
            flex: 1;
            min-width: 180px;
            background: #1f444f;
            border: 2px solid #3899ad;
            border-radius: 60px;
            padding: 16px 24px;
            font-size: 28px;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            letter-spacing: 12px;
            color: #ffe684;
            text-align: center;
            outline: none;
            box-shadow: 0 0 15px rgba(56, 153, 173, 0.3);
        }
        .digit-input:focus {
            border-color: #ffc164;
            background: #1e4d59;
            box-shadow: 0 0 25px #ffe184;
        }
        .digit-input:disabled {
            opacity: 0.5;
            background: #1a3a42;
            color: #b8ad7a;
        }
        
        .btn {
            background: #ffc857;
            border: none;
            border-radius: 60px;
            padding: 16px 32px;
            font-size: 22px;
            font-weight: 700;
            color: #06222a;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 0 #9e6b2b, 0 6px 16px black;
            transition: 0.04s;
            cursor: pointer;
            border: 1px solid #ffdd9a;
        }
        .btn:active {
            transform: translateY(8px);
            box-shadow: 0 2px 0 #8a5e26, 0 10px 20px black;
        }
        .btn:disabled {
            opacity: 0.4;
            transform: none;
            box-shadow: 0 6px 0 #6a4d23;
            pointer-events: none;
        }
        
        .history-box {
            flex: 1;
            background: #0b2228;
            border-radius: 28px;
            padding: 16px;
            overflow-y: auto;
            border: 1px solid #2f747e;
        }
        
        .player1-column .history-box {
            background: #0f2a31;
            border: 1px solid #4caaba;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.7);
            height: 360px;
        }
        
        .player2-column .history-box {
            background: #0a1e23;
            border: 1px solid #1e545e;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            padding: 12px;
            height: 300px;
            margin-bottom: 0;
        }
        
        .player2-column.pvp-mode .history-box {
            background: #0f2a31;
            border: 1px solid #4caaba;
        }
        
        .guess-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
            padding: 12px 20px;
            border-radius: 50px;
            color: white;
        }
        
        .player1-column .guess-item {
            background: #1a414b;
            border-left: 12px solid #4caaba;
        }
        
        .player2-column .guess-item {
            background: #132e35;
            border-left: 4px solid #2a636b;
            padding: 8px 14px;
            margin: 6px 0;
        }
        
        .player2-column.pvp-mode .guess-item {
            background: #1a414b;
            border-left: 12px solid #4caaba;
        }
        
        .round-tag {
            background: #11505e;
            padding: 4px 14px;
            border-radius: 30px;
            font-weight: 600;
            color: #ffeda6;
            font-size: 16px;
        }
        
        .player2-column .round-tag {
            background: #0a3a42;
            color: #bbd3d6;
            font-size: 14px;
            padding: 3px 10px;
        }
        
        .player2-column.pvp-mode .round-tag {
            background: #11505e;
            color: #ffeda6;
            font-size: 16px;
            padding: 4px 14px;
        }
        
        .guess-value {
            font-family: 'Courier New', monospace;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 6px;
            color: #ffe48f;
        }
        
        .player2-column .guess-value {
            font-size: 22px;
            letter-spacing: 4px;
            color: #d4c288;
        }
        
        .player2-column.pvp-mode .guess-value {
            font-size: 26px;
            letter-spacing: 6px;
            color: #ffe48f;
        }
        
        .correct-count {
            background: #1f6a4a;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 20px;
            font-weight: 700;
            color: #e3ffcd;
        }
        
        .player2-column .correct-count {
            background: #14523a;
            color: #b8e0c0;
            font-size: 18px;
            padding: 3px 12px;
        }
        
        .player2-column.pvp-mode .correct-count {
            background: #1f6a4a;
            color: #e3ffcd;
            font-size: 20px;
            padding: 4px 16px;
        }
        
        .win-banner {
            margin-top: 20px;
            background: #79c2ad;
            color: #002a24;
            font-weight: 800;
            font-size: 24px;
            padding: 16px 22px;
            border-radius: 50px;
            text-align: center;
            border: 2px solid #ffffbc;
        }
        
        .ai-secret-container {
            background: #0f2e35;
            border-radius: 28px;
            padding: 14px 18px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #3e8893;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
        }
        
        .ai-secret-label {
            font-size: 18px;
            color: #b1e0e6;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .ai-secret-value {
            font-family: 'Courier New', monospace;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 8px;
            background: #124049;
            padding: 6px 22px;
            border-radius: 40px;
            color: #ffde7a;
            border: 1px solid #5fb3c2;
        }
        
        .status-badge {
            background: #1d4e58;
            padding: 10px 18px;
            border-radius: 36px;
            color: #e1ffd0;
            font-size: 18px;
            font-weight: 500;
            text-align: center;
        }
        
        .player2-column .status-badge {
            background: #103a42;
            color: #b5dbd0;
            font-size: 16px;
            padding: 8px 14px;
            border: 1px solid #2a6873;
            margin-bottom: 16px;
        }
        
        .player2-column.pvp-mode .status-badge {
            background: #1d4e58;
            color: #e1ffd0;
            font-size: 18px;
            padding: 10px 18px;
        }
        
        .footer-note {
            margin-top: 20px;
            color: #b6dce3;
            text-align: center;
            font-size: 18px;
            width: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .footer-note.visible {
            opacity: 1;
            visibility: visible;
        }
        
        .player2-secret-container {
            background: #0f2e35;
            border-radius: 28px;
            padding: 14px 18px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #3e8893;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
        }
        
        .player2-secret-label {
            font-size: 18px;
            color: #b1e0e6;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .player2-secret-value {
            font-family: 'Courier New', monospace;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 8px;
            background: #124049;
            padding: 6px 22px;
            border-radius: 40px;
            color: #ffde7a;
            border: 1px solid #5fb3c2;
        }
    </style>
</head>
<body>
    <!-- 全局赢家横幅 -->
    <div id="globalWinnerBanner" class="global-winner-banner" style="display: none;">
        <span id="winnerMessage" class="winner-message"></span>
        <button id="bannerRestartBtn" class="banner-restart-btn">⟲ 重新开始</button>
    </div>
    
    <!-- 开始界面 -->
    <div id="startScreen" class="start-screen">
        <button id="startBtn" class="start-btn">🎮 开始游戏</button>
    </div>
    
    <!-- 设密界面 -->
    <div id="setupScreen" class="setup-screen hidden">
        <div class="setup-box">
            <div class="setup-title">⚙️ 选择游戏模式</div>
            
            <div class="mode-selector">
                <div id="pvpModeBtn" class="mode-btn">👥 人人PK</div>
                <div id="pveModeBtn" class="mode-btn active">🤖 人机PK</div>
            </div>
            
            <!-- 人机PK模式的输入容器（人人PK时隐藏） -->
            <div id="pveInputContainer" class="pve-input-container">
                <div id="player1SetupTitle" class="setup-title" style="font-size: 30px;">✍️ 设定电脑要猜的数字</div>
                <div class="pve-input-row">
                    <input type="text" id="secretSetupInput" class="secret-setup-input" placeholder="四位数字" maxlength="4" inputmode="numeric">
                    <button id="randomSecretBtn" class="random-btn">🎲 随机</button>
                </div>
            </div>
            
            <div class="button-group">
                <button id="submitSecretBtn" class="submit-btn">✅ 开始游戏</button>
            </div>
        </div>
    </div>

    <!-- 主PK界面 -->
    <div id="pkContainer" class="pk-container">
        <div class="top-secret">
            <div class="secret-panel">
                <span class="secret-label" id="targetSecretLabel">🤖 电脑密码（你要猜的）</span>
                <span class="secret-value" id="targetSecretMask">????</span>
            </div>
        </div>
        
        <div class="guess-row">
            <div class="player1-column">
                <div class="column-header">
                    <span class="column-title" id="player1Title">🧑‍💻 玩家1 · 猜对方</span>
                    <span class="round-badge" id="player1RoundDisplay">第 0 轮</span>
                </div>
                <div class="input-group">
                    <input type="text" id="player1GuessInput" class="digit-input" placeholder="四位数字" maxlength="4" inputmode="numeric" autofocus>
                    <button id="player1GuessBtn" class="btn">⚡ 猜</button>
                </div>
                <div id="player1HistoryList" class="history-box">
                    <div style="color: #79b5c2; text-align: center; padding: 30px;">✨ 等待你的第一次猜测</div>
                </div>
                <div id="player1WinMessage" class="win-banner" style="display: none;"></div>
            </div>
            
            <div id="player2Column" class="player2-column">
                <div class="column-header">
                    <span class="column-title" id="player2Title">🤖 电脑猜测</span>
                    <span class="round-badge" id="player2RoundDisplay">第 0 轮</span>
                </div>
                
                <div id="player2Content"></div>
                
                <div id="player2HistoryList" class="history-box">
                    <div style="color: #6f9fab; text-align: center; padding: 20px; font-size: 16px;">🤖 等待对方猜测</div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="footerNote" class="footer-note">
        🎯 双模式切换 · 人人PK自动生成掩码密码 · 人机PK需设定数字
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- 通用工具 ----------
            function generateRandomSecret() {
                return Math.floor(Math.random() * 10000).toString().padStart(4, '0');
            }

            function countExactMatches(secret, guess) {
                if (!secret || !guess || secret.length !== 4 || guess.length !== 4) return 0;
                let correct = 0;
                for (let i = 0; i < 4; i++) {
                    if (secret[i] === guess[i]) correct++;
                }
                return correct;
            }

            // ---------- DOM 元素 ----------
            const globalWinnerBanner = document.getElementById('globalWinnerBanner');
            const winnerMessage = document.getElementById('winnerMessage');
            const bannerRestartBtn = document.getElementById('bannerRestartBtn');
            
            const startScreen = document.getElementById('startScreen');
            const setupScreen = document.getElementById('setupScreen');
            const pkContainer = document.getElementById('pkContainer');
            const footerNote = document.getElementById('footerNote');
            
            const pvpModeBtn = document.getElementById('pvpModeBtn');
            const pveModeBtn = document.getElementById('pveModeBtn');
            
            const startBtn = document.getElementById('startBtn');
            const secretSetupInput = document.getElementById('secretSetupInput');
            const randomSecretBtn = document.getElementById('randomSecretBtn');
            const submitSecretBtn = document.getElementById('submitSecretBtn');
            const player1SetupTitle = document.getElementById('player1SetupTitle');
            const pveInputContainer = document.getElementById('pveInputContainer');
            
            const targetSecretLabel = document.getElementById('targetSecretLabel');
            const targetSecretMask = document.getElementById('targetSecretMask');
            const player1Title = document.getElementById('player1Title');
            const player1RoundDisplay = document.getElementById('player1RoundDisplay');
            const player1GuessInput = document.getElementById('player1GuessInput');
            const player1GuessBtn = document.getElementById('player1GuessBtn');
            const player1HistoryList = document.getElementById('player1HistoryList');
            const player1WinMessage = document.getElementById('player1WinMessage');
            
            const player2Column = document.getElementById('player2Column');
            const player2Title = document.getElementById('player2Title');
            const player2RoundDisplay = document.getElementById('player2RoundDisplay');
            const player2Content = document.getElementById('player2Content');
            const player2HistoryList = document.getElementById('player2HistoryList');

            // ---------- 游戏状态 ----------
            let currentMode = 'pve';
            
            let player1Secret = null;
            let player1Guesses = [];
            let player1GameFinished = false;
            
            let player2Secret = null;
            let player2Guesses = [];
            let player2GameFinished = false;
            
            let aiPossibleCodes = [];
            let gameOverallWinner = null;

            // ---------- 模式切换 ----------
            pvpModeBtn.addEventListener('click', () => {
                pvpModeBtn.classList.add('active');
                pveModeBtn.classList.remove('active');
                currentMode = 'pvp';
                
                // 人人PK模式：隐藏整个人机PK输入容器（标题、输入框、随机按钮）
                pveInputContainer.classList.add('hidden');
            });
            
            pveModeBtn.addEventListener('click', () => {
                pveModeBtn.classList.add('active');
                pvpModeBtn.classList.remove('active');
                currentMode = 'pve';
                
                // 人机PK模式：显示输入容器
                pveInputContainer.classList.remove('hidden');
                // 恢复标题文字
                player1SetupTitle.innerHTML = '✍️ 设定电脑要猜的数字';
            });

            // ---------- 全局赢家横幅控制 ----------
            function showGlobalWinnerBanner(winner, winnerName, secret, rounds) {
                if (winner === 'player1') {
                    globalWinnerBanner.className = 'global-winner-banner player1-win';
                    winnerMessage.textContent = `🎉 ${winnerName}赢了！猜中密码 ${secret} · 共 ${rounds} 轮 🎉`;
                } else if (winner === 'player2') {
                    globalWinnerBanner.className = 'global-winner-banner player2-win';
                    winnerMessage.textContent = `${winnerName}赢了！猜中密码 ${secret} · 共 ${rounds} 轮`;
                }
                globalWinnerBanner.style.display = 'flex';
            }
            
            function hideGlobalWinnerBanner() {
                globalWinnerBanner.style.display = 'none';
            }

            // ---------- 界面控制 ----------
            function showStartScreen() {
                startScreen.classList.remove('hidden');
                setupScreen.classList.add('hidden');
                pkContainer.classList.remove('visible');
                footerNote.classList.remove('visible');
                hideGlobalWinnerBanner();
            }
            
            function showSetupScreen() {
                startScreen.classList.add('hidden');
                setupScreen.classList.remove('hidden');
                pkContainer.classList.remove('visible');
                footerNote.classList.remove('visible');
                secretSetupInput.value = '';
                hideGlobalWinnerBanner();
                setTimeout(() => secretSetupInput.focus(), 100);
            }
            
            function showPKScreen() {
                startScreen.classList.add('hidden');
                setupScreen.classList.add('hidden');
                pkContainer.classList.add('visible');
                footerNote.classList.add('visible');
                hideGlobalWinnerBanner();
                setTimeout(() => player1GuessInput.focus(), 200);
            }

            // ---------- AI 逻辑 ----------
            function initAICandidates() {
                aiPossibleCodes = [];
                for (let i = 0; i < 10000; i++) {
                    aiPossibleCodes.push(i.toString().padStart(4, '0'));
                }
            }

            function filterCandidates(lastGuess, lastCorrect) {
                const newCandidates = [];
                for (let code of aiPossibleCodes) {
                    if (countExactMatches(code, lastGuess) === lastCorrect) {
                        newCandidates.push(code);
                    }
                }
                aiPossibleCodes = newCandidates;
            }

            function pickNextGuess() {
                if (aiPossibleCodes.length === 0) return null;
                if (player2Guesses.length === 0) return '0123';
                return aiPossibleCodes[0];
            }

            // ---------- 渲染右侧界面 ----------
            function renderPlayer2Column() {
                if (currentMode === 'pve') {
                    player2Column.className = 'player2-column';
                    player2Title.innerHTML = '🤖 电脑猜测';
                    player2Content.innerHTML = `
                        <div class="ai-secret-container">
                            <span class="ai-secret-label">🔐 你设定的密码</span>
                            <span class="ai-secret-value" id="player2SecretMask">${player2Secret || '????'}</span>
                        </div>
                        <div id="player2Status" class="status-badge" style="margin-bottom: 16px;">
                            ⚙️ 同步猜数中
                        </div>
                    `;
                } else {
                    player2Column.className = 'player2-column pvp-mode';
                    player2Title.innerHTML = '👤 玩家2 · 猜玩家1';
                    // 人人PK模式：密码显示为****（全程掩码）
                    const maskedSecret = '****';
                    player2Content.innerHTML = `
                        <div class="player2-secret-container">
                            <span class="player2-secret-label">🔐 玩家1的密码</span>
                            <span class="player2-secret-value" id="player2SecretMask">${maskedSecret}</span>
                        </div>
                        <div class="input-group" style="margin-bottom: 16px;">
                            <input type="text" id="player2GuessInput" class="digit-input" placeholder="四位数字" maxlength="4" inputmode="numeric">
                            <button id="player2GuessBtn" class="btn">⚡ 猜</button>
                        </div>
                    `;
                    
                    setTimeout(() => {
                        const p2Input = document.getElementById('player2GuessInput');
                        const p2Btn = document.getElementById('player2GuessBtn');
                        if (p2Input && p2Btn) {
                            p2Input.disabled = player2GameFinished || gameOverallWinner !== null;
                            p2Btn.disabled = player2GameFinished || gameOverallWinner !== null;
                            
                            p2Btn.onclick = (e) => {
                                e.preventDefault();
                                submitPlayer2Guess();
                            };
                            p2Input.onkeydown = (e) => {
                                if (e.key === 'Enter') {
                                    e.preventDefault();
                                    submitPlayer2Guess();
                                }
                            };
                            p2Input.oninput = function() {
                                this.value = this.value.replace(/[^0-9]/g, '');
                            };
                        }
                    }, 50);
                }
            }

            // ---------- 结束游戏 ----------
            function endGame(winner) {
                gameOverallWinner = winner;
                
                player1GameFinished = true;
                player1GuessBtn.disabled = true;
                player1GuessInput.disabled = true;
                
                player2GameFinished = true;
                
                if (currentMode === 'pvp') {
                    const p2Input = document.getElementById('player2GuessInput');
                    const p2Btn = document.getElementById('player2GuessBtn');
                    if (p2Input) p2Input.disabled = true;
                    if (p2Btn) p2Btn.disabled = true;
                }

                if (winner === 'player1') {
                    player1WinMessage.style.display = 'block';
                    player1WinMessage.innerHTML = `🎉 玩家1猜中了密码 ${player1Secret} · 共 ${player1Guesses.length} 轮 🎉`;
                    showGlobalWinnerBanner('player1', '玩家1', player1Secret, player1Guesses.length);
                    // 游戏结束时揭示密码
                    if (currentMode === 'pvp') {
                        const p2SecretMask = document.getElementById('player2SecretMask');
                        if (p2SecretMask) p2SecretMask.textContent = player2Secret;
                    }
                    // 揭示玩家1要猜的密码
                    targetSecretMask.textContent = player1Secret;
                } else if (winner === 'player2') {
                    const winnerName = currentMode === 'pve' ? '电脑' : '玩家2';
                    showGlobalWinnerBanner('player2', winnerName, player2Secret, player2Guesses.length);
                    targetSecretMask.textContent = player1Secret;
                    // 游戏结束时揭示密码
                    if (currentMode === 'pvp') {
                        const p2SecretMask = document.getElementById('player2SecretMask');
                        if (p2SecretMask) p2SecretMask.textContent = player2Secret;
                    }
                }
            }

            // ---------- 玩家1提交猜测 ----------
            function submitPlayer1Guess() {
                if (player1GameFinished || gameOverallWinner) return false;
                
                let raw = player1GuessInput.value.trim().replace(/\D/g, '');
                if (raw.length !== 4) {
                    alert('请输入恰好四位数字');
                    player1GuessInput.value = '';
                    player1GuessInput.focus();
                    return false;
                }
                if (player1Guesses.some(g => g.guess === raw)) {
                    alert(`你已经猜过 ${raw} 了`);
                    player1GuessInput.value = '';
                    player1GuessInput.focus();
                    return false;
                }

                const correct = countExactMatches(player1Secret, raw);
                player1Guesses.push({ guess: raw, correct, round: player1Guesses.length + 1 });
                renderPlayer1History();
                player1GuessInput.value = '';
                player1GuessInput.focus();

                if (correct === 4) {
                    endGame('player1');
                    renderPlayer1History();
                    renderPlayer2History();
                    return true;
                }

                if (!player2GameFinished && !gameOverallWinner) {
                    if (currentMode === 'pve') {
                        performAIGuess();
                    }
                }
                return true;
            }

            // ---------- 玩家2提交猜测（人人模式）---------
            function submitPlayer2Guess() {
                if (currentMode !== 'pvp' || player2GameFinished || gameOverallWinner) return false;
                
                const p2Input = document.getElementById('player2GuessInput');
                if (!p2Input) return false;
                
                let raw = p2Input.value.trim().replace(/\D/g, '');
                if (raw.length !== 4) {
                    alert('请输入恰好四位数字');
                    p2Input.value = '';
                    p2Input.focus();
                    return false;
                }
                if (player2Guesses.some(g => g.guess === raw)) {
                    alert(`玩家2已经猜过 ${raw} 了`);
                    p2Input.value = '';
                    p2Input.focus();
                    return false;
                }

                const correct = countExactMatches(player2Secret, raw);
                player2Guesses.push({ guess: raw, correct, round: player2Guesses.length + 1 });
                renderPlayer2History();
                p2Input.value = '';
                p2Input.focus();

                if (correct === 4) {
                    endGame('player2');
                    renderPlayer1History();
                    renderPlayer2History();
                    return true;
                }
                return true;
            }

            // ---------- 电脑执行猜测 ----------
            function performAIGuess() {
                if (!player2Secret || player2GameFinished || gameOverallWinner) return false;

                if (aiPossibleCodes.length === 0) {
                    initAICandidates();
                }

                let guess = pickNextGuess();
                if (!guess) return false;

                let attempts = 0;
                while (player2Guesses.some(g => g.guess === guess) && attempts < 10) {
                    const idx = aiPossibleCodes.indexOf(guess);
                    if (idx !== -1 && aiPossibleCodes.length > 1) {
                        aiPossibleCodes.splice(idx, 1);
                    }
                    guess = pickNextGuess();
                    attempts++;
                    if (!guess) return false;
                }

                const correct = countExactMatches(player2Secret, guess);
                player2Guesses.push({ guess, correct, round: player2Guesses.length + 1 });
                renderPlayer2History();

                filterCandidates(guess, correct);

                if (correct === 4) {
                    endGame('player2');
                    renderPlayer2History();
                    renderPlayer1History();
                    return true;
                }
                return true;
            }

            // ---------- 渲染历史记录 ----------
            function renderPlayer1History() {
                if (player1Guesses.length === 0) {
                    player1HistoryList.innerHTML = `<div style="color: #79b5c2; text-align: center; padding: 30px;">✨ 等待你的第一次猜测</div>`;
                    player1RoundDisplay.textContent = `第 0 轮`;
                    return;
                }
                let html = '';
                player1Guesses.forEach(item => {
                    html += `
                        <div class="guess-item">
                            <span class="round-tag">#${item.round}</span>
                            <span class="guess-value">${item.guess}</span>
                            <span class="correct-count">✅ ${item.correct}</span>
                        </div>
                    `;
                });
                player1HistoryList.innerHTML = html;
                player1HistoryList.scrollTop = player1HistoryList.scrollHeight;
                player1RoundDisplay.textContent = `第 ${player1Guesses.length} 轮`;
            }

            function renderPlayer2History() {
                if (player2Guesses.length === 0) {
                    player2HistoryList.innerHTML = `<div style="color: #6f9fab; text-align: center; padding: 20px; font-size: 16px;">${currentMode === 'pve' ? '🤖 等待电脑猜测' : '👤 等待玩家2猜测'}</div>`;
                    player2RoundDisplay.textContent = `第 0 轮`;
                    return;
                }
                let html = '';
                player2Guesses.forEach(item => {
                    html += `
                        <div class="guess-item">
                            <span class="round-tag">#${item.round}</span>
                            <span class="guess-value">${item.guess}</span>
                            <span class="correct-count">✅ ${item.correct}</span>
                        </div>
                    `;
                });
                player2HistoryList.innerHTML = html;
                player2HistoryList.scrollTop = player2HistoryList.scrollHeight;
                player2RoundDisplay.textContent = `第 ${player2Guesses.length} 轮`;
            }

            // ---------- 重置游戏 ----------
            function fullResetToSetup() {
                player1Secret = null;
                player1Guesses = [];
                player1GameFinished = false;
                
                player2Secret = null;
                player2Guesses = [];
                player2GameFinished = false;
                
                aiPossibleCodes = [];
                gameOverallWinner = null;
                
                player1GuessInput.value = '';
                secretSetupInput.value = '';
                
                targetSecretMask.textContent = '????';
                player1WinMessage.style.display = 'none';
                
                renderPlayer1History();
                renderPlayer2History();
                
                hideGlobalWinnerBanner();
                showSetupScreen();
            }

            // ---------- 启动PK ----------
            function startPK() {
                if (currentMode === 'pve') {
                    // 人机PK模式：需要用户输入密码
                    let p1SecretRaw = secretSetupInput.value.trim().replace(/\D/g, '');
                    if (p1SecretRaw.length !== 4) {
                        alert('请输入恰好四位数字作为电脑要猜的密码');
                        return;
                    }
                    player2Secret = p1SecretRaw;
                    player1Secret = generateRandomSecret();
                    targetSecretLabel.innerHTML = '🤖 电脑密码（你要猜的）';
                    player1Title.innerHTML = '🧑‍💻 你的回合 · 猜电脑';
                    targetSecretMask.textContent = '????';
                } else {
                    // 人人PK模式：无需用户输入，自动生成双方掩码密码
                    // 生成两个随机4位数字
                    player2Secret = generateRandomSecret(); // 玩家1要猜的（玩家2的密码）
                    player1Secret = generateRandomSecret(); // 玩家2要猜的（玩家1的密码）
                    
                    targetSecretLabel.innerHTML = '👤 玩家2密码（你要猜的）';
                    player1Title.innerHTML = '🧑‍💻 玩家1 · 猜玩家2';
                    targetSecretMask.textContent = '????'; // 全程掩码，不显示明文
                }
                
                // 重置双方猜测记录
                player1Guesses = [];
                player1GameFinished = false;
                player1GuessBtn.disabled = false;
                player1GuessInput.disabled = false;
                player1GuessInput.value = '';
                player1WinMessage.style.display = 'none';
                
                player2Guesses = [];
                player2GameFinished = false;
                aiPossibleCodes = [];
                
                renderPlayer1History();
                renderPlayer2History();
                
                renderPlayer2Column();
                
                gameOverallWinner = null;
                hideGlobalWinnerBanner();
                showPKScreen();
            }

            // ---------- 事件绑定 ----------
            function init() {
                showStartScreen();
                
                startBtn.onclick = (e) => {
                    e.preventDefault();
                    showSetupScreen();
                };
                
                randomSecretBtn.onclick = (e) => {
                    e.preventDefault();
                    secretSetupInput.value = generateRandomSecret();
                };
                
                submitSecretBtn.onclick = (e) => {
                    e.preventDefault();
                    startPK();
                };
                
                secretSetupInput.onkeydown = (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        startPK();
                    }
                };
                
                secretSetupInput.oninput = function() {
                    this.value = this.value.replace(/[^0-9]/g, '');
                };
                
                player1GuessBtn.onclick = (e) => { e.preventDefault(); submitPlayer1Guess(); };
                player1GuessInput.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); submitPlayer1Guess(); } };
                player1GuessInput.oninput = function() { this.value = this.value.replace(/[^0-9]/g, ''); };
                
                bannerRestartBtn.onclick = (e) => {
                    e.preventDefault();
                    fullResetToSetup();
                };
            }

            init();
        })();
    </script>
</body>
</html>
